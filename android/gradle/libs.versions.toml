# Every version below is one I know exists. Android Studio's "Upgrade available" hints (and
# `./gradlew dependencyUpdates`-style checks) will show newer ones: bump ONE group at a time and run the tests.
[versions]
agp = "8.13.0"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.3"
composeBom = "2025.09.00"
coreKtx = "1.16.0"
splash = "1.0.1"
activityCompose = "1.11.0"
lifecycle = "2.9.4"
navigation = "2.9.4"
hilt = "2.57.1"
hiltAndroidx = "1.2.0"
room = "2.8.0"
retrofit = "3.0.0"
okhttp = "5.1.0"
serialization = "1.9.0"
coroutines = "1.10.2"
workmanager = "2.10.3"
firebaseBom = "33.16.0"
credentials = "1.5.0"
googleid = "1.1.1"
tink = "1.18.0"
datastore = "1.1.7"
biometric = "1.1.0"
vico = "2.1.3"
googleServices = "4.4.3"
junit = "4.13.2"
mockk = "1.14.5"
turbine = "1.2.1"
robolectric = "4.14.1"
androidxTest = "1.6.1"
androidxTestExt = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splash" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
